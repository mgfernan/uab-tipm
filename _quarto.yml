project:
  title: "PTIG Presentation"
  output-dir: dist
  resources:
    - assets/
    - docs/
    - slides/

# Shared citation database available to all slides in the project.
bibliography: docs/references.bib
link-citations: true

format:
  revealjs:
    slide-number: true
    preview-links: auto
    css: assets/styles.css
    footer: "Master's Degree in Telecommunication Engineering | UAB"
    #theme: default
    #transition: fade
    #smaller: false
    center: false
    center-title-slide: false
    #navigation-mode: linear
    #controls-layout: edges
    #pdf-separate-fragments: false
    slide-level: 3
    embed-resources: true
    include-in-header:
      text: |
        <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
        <script src="assets/01_theory_beam_interactive.js"></script>
        <script src="assets/slide-path.js"></script>
    code:
      show: false
editor: source

filters:
  - acronyms