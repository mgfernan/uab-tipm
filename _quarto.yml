project:
  title: "PTIG Presentation"
  output-dir: dist
  resources:
    - assets/
    - docs/
    - slides/

# Shared citation database available to all slides in the project.
bibliography: docs/references.bib
link-citations: true

format:
  revealjs:
    theme: default
    css: assets/styles.css
    slide-number: true
    hash: true
    transition: fade
    chalkboard: false
    smaller: false
    center: false
    navigation-mode: linear
    controls-layout: edges
    pdf-separate-fragments: false
    slide-level: 2

editor: source