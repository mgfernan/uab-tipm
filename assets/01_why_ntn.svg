<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 54px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#0f172a}
      .h{font:600 30px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#0f172a}
      .t{font:500 26px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#0f172a}
      .small{font:500 22px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#0f172a}
      .muted{fill:#475569}
      .blue{stroke:#2563eb}
      .ink{stroke:#0f172a}
      .wire{stroke:#2563eb; stroke-width:6; fill:none; stroke-linecap:round}
      .thin{stroke-width:3}
      .card{fill:#ffffff; stroke:#e2e8f0; stroke-width:4}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc"/>

  <!-- Central satellite -->
  <g transform="translate(800,290)">
    <!-- satellite body -->
    <ellipse cx="0" cy="0" rx="72" ry="42" fill="#0b1220" opacity="0.06"/>
    <circle cx="0" cy="0" r="62" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    <!-- dish -->
    <path d="M-12,0 C-12,-40 40,-40 40,0 C40,10 30,20 20,22 C5,25 -12,15 -12,0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    <circle cx="2" cy="2" r="10" fill="#2563eb"/>
    <!-- orbit lines -->
    <path d="M-95,35 C-50,-15 50,-15 95,35" class="blue" stroke="#2563eb" stroke-width="3" fill="none" opacity="0.35"/>
  </g>

  <!-- Connection lines (satellite -> both regions) -->
  <path d="M800 350 C650 420, 560 510, 470 590" class="wire" marker-end="url(#arrow)"/>
  <path d="M800 350 C960 420, 1060 520, 1160 610" class="wire" marker-end="url(#arrow)"/>

  <!-- Left panel: Service in -> Sparsely populated areas -->
  <g transform="translate(90,220)">
    <rect x="0" y="0" rx="24" ry="24" width="640" height="600" class="card"/>
    <text x="45" y="80" class="h">Service in</text>

    <!-- Region icon (scattered houses) -->
    <g transform="translate(70,140)">
      <path d="M0,280 C70,220 140,230 220,200 C290,175 350,210 420,150 L420,380 L0,380 Z"
            fill="#e5e7eb" opacity="0.9"/>
      <!-- scattered houses -->
      <g fill="#ffffff" stroke="#cbd5e1" stroke-width="3">
        <rect x="55" y="220" width="60" height="45" rx="8"/>
        <polygon points="85,210 70,225 100,225" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
        <rect x="160" y="190" width="62" height="52" rx="8"/>
        <polygon points="191,180 175,196 207,196" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
        <rect x="290" y="230" width="62" height="48" rx="8"/>
        <polygon points="321,220 305,236 337,236" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
      </g>

      <!-- faint base station tower -->
      <g transform="translate(360,80)" opacity="0.55">
        <rect x="0" y="120" width="18" height="95" rx="6" fill="#94a3b8"/>
        <path d="M-12,130 L9,95 L30,130" fill="#94a3b8"/>
        <circle cx="9" cy="118" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
      </g>

      <!-- label -->
      <text x="0" y="70" class="t">Sparsely populated areas</text>
      <text x="0" y="40" class="small muted">•</text>
    </g>

    <!-- Left callout arrow (curved) -->
    <path d="M620 90 C520 120 450 185 410 240" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  </g>

  <!-- Right panel: Remote areas when base station deployment is not possible -->
  <g transform="translate(870,240)">
    <rect x="0" y="0" rx="24" ry="24" width="640" height="560" class="card"/>
    <text x="45" y="80" class="h">Remote areas</text>
    <text x="45" y="130" class="t">when base station deployment</text>
    <text x="45" y="180" class="t">is not possible</text>

    <!-- Region icon (barren / no infrastructure) -->
    <g transform="translate(70,220)">
      <path d="M0,240 C90,160 175,195 250,140 C330,85 380,120 420,70 L420,400 L0,400 Z"
            fill="#e5e7eb" opacity="0.95"/>
      <!-- crossed-out base station tower -->
      <g transform="translate(260,40)" opacity="0.8">
        <rect x="0" y="120" width="18" height="95" rx="6" fill="#94a3b8"/>
        <path d="M-12,130 L9,95 L30,130" fill="#94a3b8"/>
        <circle cx="9" cy="118" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
        <path d="M-15,135 L40,210" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
        <path d="M35,135 L-20,210" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- small rocks/markers -->
      <g fill="#ffffff" stroke="#cbd5e1" stroke-width="3" opacity="0.9">
        <circle cx="70" cy="250" r="20"/>
        <circle cx="140" cy="210" r="14"/>
        <circle cx="210" cy="260" r="18"/>
      </g>
    </g>

    <!-- Right callout arrow (curved) -->
    <path d="M30 90 C150 125 250 205 290 270" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  </g>
</svg>
